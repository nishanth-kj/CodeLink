name: Package VSIX

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main
      - "release/**"
      - "release-*"

permissions:
  contents: write

jobs:
  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check version consistency
        run: node scripts/version.mjs check

      - name: Check release tag matches .version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "$(cat .version)"

      - name: Install extension dependencies
        run: npm install --prefix extension

      - name: Compile extension
        run: npm run build

      - name: Package VSIX
        working-directory: extension
        run: npx vsce package -o ../codelink.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: codelink-vsix
          path: codelink.vsix
          if-no-files-found: error

      - name: Publish to VS Code Marketplace
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            echo "Publishing to VS Code Marketplace..."
            npx vsce publish --packagePath ../codelink.vsix -p "$VSCE_PAT"
          else
            echo "VSCE_PAT secret is not set in repository settings. Skipping marketplace publish."
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: codelink.vsix
          generate_release_notes: true
