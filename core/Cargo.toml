[package]
name = "codelink-core"
version = "0.2.1"
edition = "2021"
description = "CodeLink native system layer: filesystem, process, search, and Git operations over a JSON IPC protocol."
license = "MIT"
repository = "https://github.com/nishanth-kj/CodeLink"

[[bin]]
name = "codelink-core"
path = "src/main.rs"

[lib]
name = "codelink_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
ignore = "0.4"
globset = "0.4"
notify = "6"
dunce = "1"
regex = "1"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
strip = true
